# Opcional: levanta PostgreSQL sin instalarlo (docker compose up -d)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: arriendos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
