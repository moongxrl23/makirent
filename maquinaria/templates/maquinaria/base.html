{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}MakiRent · Arriendo de maquinaria{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'css/estilo.css' %}">
</head>
<body>
  <header class="nav">
    <a class="logo" href="{% url 'inicio' %}">
      <img src="{% static 'img/logo.png' %}" alt="" height="32">
      MakiRent
    </a>
    <nav>
      <a href="{% url 'inicio' %}">Inicio</a>
      <a href="{% url 'maquinas' %}">Máquinas</a>
      <a href="{% url 'clientes' %}">Clientes</a>
      <a href="{% url 'arriendos' %}">Arriendos</a>
      <a href="{% url 'contacto' %}">Contacto</a>
      <a href="/api/" class="api">API</a>
    </nav>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
  <footer>MakiRent — Arriendo de maquinaria pesada · Temuco, Chile</footer>
</body>
</html>
