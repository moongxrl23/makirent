{% extends "maquinaria/base.html" %}
{% block contenido %}
<!-- Template reutilizable para crear máquinas, clientes y arriendos -->
<h1>{{ titulo }}</h1>
<form method="post" class="form">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Guardar</button>
  <a href="{% url volver %}">Cancelar</a>
</form>
{% endblock %}
